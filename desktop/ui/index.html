<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soop AI Desktop</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="logo.svg" alt=""><span>Soop AI</span><span class="tag">Desktop</span></div>
    <div id="breadcrumb"></div><button id="top-open" class="outline"></button>
    <div class="window-controls"><button id="minimize" title="Свернуть" aria-label="Свернуть">─</button><button id="maximize" title="Развернуть" aria-label="Развернуть">□</button><button id="close" title="Закрыть" aria-label="Закрыть">✕</button></div>
  </header>
  <div class="shell">
    <nav id="rail" aria-label="Workspace"></nav>
    <aside id="sidebar"></aside>
    <main id="workspace" hidden></main>
    <section id="chat" aria-label="Chat">
      <div class="panel-header"><strong id="chat-heading"></strong><button id="chat-refresh">↻</button></div>
      <div id="messages" aria-live="polite"></div>
      <div class="compose">
        <div id="attachments" class="attachments"></div>
        <textarea id="prompt" rows="3"></textarea>
        <div class="composer-tools">
          <div class="tools"><button id="attach" class="icon">＋</button><input type="file" id="attachment-input" multiple hidden>
          <button id="attach-file" hidden>＠</button><div class="models"><button id="model"></button><div id="model-menu" hidden></div></div>
          <select id="image-size" hidden><option>1024x1024</option><option>1536x1024</option><option>1024x1536</option></select></div>
          <div class="tools"><button id="image-mode" class="icon">▧</button><button id="send" class="primary icon">↑</button></div>
        </div>
      </div>
    </section>
  </div>
  <footer><span id="status"></span><span id="usage"></span></footer>
  <dialog id="overlay"></dialog>
</body>
</html>
